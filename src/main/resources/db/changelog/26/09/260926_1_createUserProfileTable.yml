databaseChangeLog:
  - changeSet:
      id: 260926_1_createUserProfileTable
      author: llemaxss
      comment: Create user profile table

      changes:
        - createTable:
            tableName: school_user_profile
            columns:
              # common fields #
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_user_profile
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 1
                  constraints:
                    nullable: false
              - column:
                  name: create_ts
                  type: timestamp with time zone
                  defaultValueComputed: current_timestamp
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: update_ts
                  type: timestamp with time zone
              - column:
                  name: updated_by
                  type: varchar(255)
              - column:
                  name: delete_ts
                  type: timestamp with time zone
              - column:
                  name: deleted_by
                  type: varchar(255)

              # other fields #
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_user_role_profile_to_user
                    references: school_user(id)
              - column:
                  name: first_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: middle_name
                  type: varchar(255)
              - column:
                  name: date_of_birth
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: gender
                  type: varchar(50)
                  constraints:
                    nullable: false

        # indexes #
        - sql:
            sql: |
              CREATE UNIQUE INDEX IF NOT EXISTS idx_unique_user_profile_user
              ON school_user_profile (user_id)
              WHERE delete_ts IS NULL;

      # rollback #
      rollback:
        - dropTable:
            tableName: school_user_profile