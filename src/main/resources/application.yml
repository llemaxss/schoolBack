# Common

spring:
  application:
    name: schoolBack
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:DEV}
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: ${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:public}
  liquibase:
    change-log: classpath:db/changelog/changelog.yml

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

app:
  version: 1.6.1

# DEV profile
---
spring:
  config:
    activate:
      on-profile: DEV
  datasource:
    url: jdbc:postgresql://${DEV__SPRING_DATASOURCE_HOST}:${DEV__SPRING_DATASOURCE_PORT}/${DEV__SPRING_DATASOURCE_NAME}
    username: ${DEV__SPRING_DATASOURCE_USERNAME}
    password: ${DEV__SPRING_DATASOURCE_PASSWORD}

server:
  port: ${DEV__SERVER_PORT}

logging:
  level:
    root: WARN
    com.gmail.llemaxiss.app: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    liquibase: WARN

#
app:
  jwt-secret: ${DEV__APP_JWT_SECRET}
  jwt-expiration-millis: ${DEV__APP_JWT_EXPIRATION_MILLIS}

# PROD profile
---
spring:
  config:
    activate:
      on-profile: PROD
  datasource:
    url: jdbc:postgresql://${PROD__SPRING_DATASOURCE_HOST}:${PROD__SPRING_DATASOURCE_PORT}/${PROD__SPRING_DATASOURCE_NAME}
    username: ${PROD__SPRING_DATASOURCE_USERNAME}
    password: ${PROD__SPRING_DATASOURCE_PASSWORD}

server:
  port: ${PROD__SERVER_PORT}

logging:
  level:
    root: WARN
    com.gmail.llemaxiss.app: INFO
    org.springframework.security: WARN
    liquibase: WARN

#
app:
  jwt-secret: ${PROD__APP_JWT_SECRET}
  jwt-expiration-millis: ${PROD__APP_JWT_EXPIRATION_MILLIS}