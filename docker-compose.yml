services:
  ## db
  db:
    image: postgres:16-alpine
    container_name: school_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:${_DOCKER_CONTAINER_INTERNAL_DB_PORT}"

    volumes:
      - school_db_data:/var/lib/postgresql/data

    healthcheck:
      test: [
        "CMD-SHELL",
        "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ## app
  app:
    build: .
    container_name: school_app
    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${_DOCKER_CONTAINER_INTERNAL_APP_PORT}"

    environment:
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      DB_HOST: db
      DB_PORT: ${_DOCKER_CONTAINER_INTERNAL_DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: ${_DOCKER_CONTAINER_INTERNAL_APP_PORT}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MILLIS: ${JWT_EXPIRATION_MILLIS}

    depends_on:
      db:
        condition: service_healthy

volumes:
  school_db_data: